[platformio]
default_envs = xiao_esp32c6

[env:xiao_esp32c6]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38/platform-espressif32.zip
board = seeed_xiao_esp32c6
framework = arduino
board_build.partitions = partitions.csv
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
build_flags =
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
  adafruit/Adafruit GFX Library@1.12.6
  adafruit/Adafruit BusIO@1.17.4

[env:xiao_esp32c6_video]
extends = env:xiao_esp32c6
board_build.embed_files = assets/badapple.bin
build_flags =
  ${env:xiao_esp32c6.build_flags}
  -D EPD_ENABLE_VIDEO=1
